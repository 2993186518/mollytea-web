<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>茉莉学堂</title></head><body>
<script>
(async function(){
  const base="https://raw.githubusercontent.com/2993186518/mollytea-web/main/chunks/";
  const n=7; let s="";
  for(let i=1;i<=n;i++){
    const r=await fetch(base+"chunk"+String(i).padStart(2,"0")+".txt",{cache:"no-store"});
    if(!r.ok) throw new Error("加载失败 "+r.status);
    s+=await r.text();
  }
  const bin=atob(s.replace(/\s/g,""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<p style="font:16px sans-serif;padding:24px;color:#333">页面加载失败：'+e.message+'</p>'});
</script></body></html>
